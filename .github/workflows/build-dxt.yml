name: Build and Release DXT Package

on:
  push:
  workflow_run:
    workflows: ["Tests"]
    types:
      - completed
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'release' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest
        
    - name: Install dependencies
      run: bun install
      
    - name: Build TypeScript
      run: bun run build
      
    - name: Update manifest version
      run: |
        set -e
        echo "Updating manifest version..."
        VERSION=$(jq -r '.version' package.json)
        if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
          echo "Error: Could not read version from package.json"
          exit 1
        fi
        echo "Setting manifest version to: $VERSION"
        jq --arg version "$VERSION" '.version = $version' manifest.json > manifest.tmp
        if [ ! -s manifest.tmp ]; then
          echo "Error: Failed to update manifest.json"
          exit 1
        fi
        mv manifest.tmp manifest.json
        echo "Manifest updated to version $VERSION"
      
    - name: Validate build output
      run: |
        set -e
        for f in dist/talk_to_figma_mcp/server.cjs dist/socket.cjs; do
          if [ ! -f "$f" ]; then
            echo "Error: $f not found after build"
            ls -la dist/ || true
            exit 1
          fi
        done

    # Uses the pinned @anthropic-ai/dxt devDependency. The output name is fixed
    # because dxt pack otherwise names the file after the checkout folder.
    - name: Create DXT package
      run: bun run pack

    - name: Get package info
      id: package
      run: |
        echo "version=$(jq -r '.version' package.json)" >> $GITHUB_OUTPUT
        
    - name: Upload DXT artifact
      uses: actions/upload-artifact@v4
      with:
        name: talk-to-figma-mcp-${{ steps.package.outputs.version }}.dxt
        path: talk-to-figma-mcp.dxt
        retention-days: 90
        if-no-files-found: error
        
    - name: Upload to release (on release only)
      if: github.event_name == 'release'
      run: |
        set -e
        gh release upload ${{ github.event.release.tag_name }} \
          talk-to-figma-mcp.dxt \
          --clobber
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}